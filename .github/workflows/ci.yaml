name: Python api
on:
 push:
jobs:
  ci:
   runs-on: ubuntu-latest
   steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
       python-version: "3.12"
    - name: List files
      run: ls
    - name: List test
      run: ls test
    - name: Install dependecies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

